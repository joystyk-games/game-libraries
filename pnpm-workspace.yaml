# The Gyral packages the published libraries import, as peers (`catalog:peers`): the app's own
# copy of each is shared, never a second core (Gyral's component-libraries guide). The caret
# floor is the oldest Gyral the libraries are built and tested with; raise it when they need a
# newer API. The default catalog above pins that version for the libraries' own builds and tests.
catalogs:
  peers:
    "@gyral/core": ^0.3.8
    "@gyral/http": ^0.3.8
    "@gyral/router": ^0.3.8
    "@gyral/ssr": ^0.3.8
engineStrict: true
saveExact: true
